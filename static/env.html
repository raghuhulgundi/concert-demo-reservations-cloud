<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo environment</title>
<style>
  :root {
    --bg: #f4f4f4; --card: #ffffff; --ink: #161616; --muted: #6f6f6f; --line: #e0e0e0;
    --accent: #0f62fe; --ok: #198038; --busy: #da1e28; --env: #0f62fe;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 32px 48px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 14px; }
  .topbar a.back { text-decoration: none; font-weight: 600; }
  .who { color: var(--muted); font-size: 13px; }
  .hero { background: var(--card); border-radius: 8px; border-top: 8px solid var(--env); box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 28px 32px; margin: 18px 0 20px; }
  .hero-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 40px; line-height: 1.1; }
  .tagline { margin: 8px 0 0; font-size: 20px; font-weight: 600; color: var(--env); }
  .desc { margin: 6px 0 0; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.free { color: var(--ok); background: #defbe6; }
  .pill.busy { color: var(--busy); background: #fff1f1; }
  .status { margin: 18px 0 0; font-size: 15px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--env); color: #fff; }
  .btn.primary:hover { filter: brightness(.92); }
  .btn.ghost { background: #fff; color: var(--ink); border-color: #c6c6c6; }
  .btn.ghost:hover { background: #f4f4f4; }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
  .panel { background: var(--card); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 22px 24px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 17px; }
  .details { white-space: pre-wrap; line-height: 1.55; font-size: 15px; overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; }
  .notes { margin: 0; font-size: 14px; background: #fff8e1; border-left: 4px solid #f1c21b; padding: 10px 12px; border-radius: 0 4px 4px 0; }
  ul.links, ul.upcoming { list-style: none; margin: 0; padding: 0; }
  ul.links li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  ul.links li:last-child { border-bottom: none; }
  ul.links a { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  ul.links a:hover { text-decoration: underline; }
  ul.upcoming li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  ul.upcoming li:last-child { border-bottom: none; }
  ul.upcoming .when { font-weight: 600; }
  ul.upcoming .sub { display: block; color: var(--muted); font-size: 13px; }
  .others { font-size: 14px; color: var(--muted); }
  .others a { margin-left: 8px; font-weight: 600; }
  @media (max-width: 760px) { .wrap { padding: 14px; } .grid { grid-template-columns: 1fr; } h1 { font-size: 32px; } .hero { padding: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/">&larr; All environments</a>
    <span class="who" id="who" hidden><span id="whoText"></span> &middot; <a href="/auth/logout">Sign out</a></span>
  </div>

  <section class="hero" id="hero">
    <div class="hero-head">
      <div>
        <h1 id="name">Loading...</h1>
        <p class="tagline" id="tagline" hidden></p>
        <p class="desc" id="desc"></p>
      </div>
      <span class="pill" id="pill" hidden></span>
    </div>
    <div class="status" id="status"></div>
    <div class="actions">
      <a class="btn primary" id="launch" target="_blank" rel="noopener">Launch console &#8599;</a>
      <a class="btn ghost" id="reserve" href="/">Reserve time</a>
      <a class="btn ghost" id="edit" href="/" hidden>Edit this page</a>
    </div>
  </section>

  <div class="grid">
    <div>
      <section class="panel">
        <h2>About this demo</h2>
        <div class="details" id="details"></div>
      </section>
      <section class="panel" id="notesPanel" hidden>
        <h2>Notes</h2>
        <p class="notes" id="notes"></p>
      </section>
    </div>
    <div>
      <section class="panel">
        <h2>Useful links</h2>
        <ul class="links" id="links"></ul>
      </section>
      <section class="panel">
        <h2>Upcoming reservations</h2>
        <ul class="upcoming" id="upcoming"></ul>
      </section>
    </div>
  </div>
  <p class="others" id="others"></p>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var envId = decodeURIComponent(location.pathname.replace(/^\/env\//, "").replace(/\/$/, ""));
  var S = { cfg: null, me: { auth: false }, env: null, bookings: [], lastActive: Date.now() };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function api(path) {
    return fetch(path).then(function (r) {
      if (r.status === 401) { location.href = "/auth/login?next=" + encodeURIComponent(location.pathname); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; });
    });
  }
  function iso(d) { return d.toISOString().replace(/\.\d{3}Z$/, "Z"); }
  function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
  function fmtTime(d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function fmtDay(d) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var tm = new Date(t); tm.setDate(t.getDate() + 1);
    if (sameDay(d, t)) return "Today";
    if (sameDay(d, tm)) return "Tomorrow";
    return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  }
  function hasUrl(env) { return env.url && !/REPLACE/i.test(env.url); }

  // Plain text with clickable http(s) links; everything else stays text (no HTML is interpreted).
  function linkify(target, text) {
    var re = /https?:\/\/[^\s<>"]+[^\s<>".,;:!?)\]]/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) target.appendChild(document.createTextNode(text.slice(last, m.index)));
      target.appendChild(el("a", { href: m[0], target: "_blank", rel: "noopener", text: m[0] }));
      last = m.index + m[0].length;
    }
    if (last < text.length) target.appendChild(document.createTextNode(text.slice(last)));
  }

  function render() {
    var env = S.env, now = new Date();
    document.title = env.name + (env.tagline ? " · " + env.tagline : "") + " · " + (S.cfg.title || "Demo environments");
    document.documentElement.style.setProperty("--env", env.color || "#0f62fe");
    $("name").textContent = env.name;
    $("tagline").textContent = env.tagline || ""; $("tagline").hidden = !env.tagline;
    $("desc").textContent = env.description || "";

    var mine = S.bookings.filter(function (b) { return b.env === env.id; });
    var cur = mine.filter(function (b) { return b.s <= now && b.e > now; })[0];
    var next = mine.filter(function (b) { return b.s > now; });
    var pill = $("pill"); pill.hidden = false;
    pill.className = "pill " + (cur ? "busy" : "free"); pill.textContent = cur ? "In use" : "Available now";
    var st = $("status"); st.innerHTML = "";
    if (cur) st.appendChild(el("span", {}, [el("b", { text: cur.name }), " has it until " + fmtTime(cur.e) + (cur.purpose ? " (" + cur.purpose + ")" : "") + ". You can still open it, but check with them first."]));
    else if (next.length) st.appendChild(el("span", {}, ["Free until ", el("b", { text: fmtDay(next[0].s) + " " + fmtTime(next[0].s) }), " (" + next[0].name + "). Reserve a slot so others know you're using it."]));
    else st.textContent = "No reservations in the next 14 days. Reserve a slot so others know you're using it.";

    var launch = $("launch");
    launch.textContent = "Launch " + env.name + " console ↗";
    if (hasUrl(env)) { launch.href = env.url; launch.removeAttribute("aria-disabled"); launch.title = env.url; }
    else { launch.removeAttribute("href"); launch.setAttribute("aria-disabled", "true"); launch.title = "Console URL not set yet"; }
    $("reserve").href = "/?reserve=" + encodeURIComponent(env.id);
    $("edit").href = "/?edit=" + encodeURIComponent(env.id); $("edit").hidden = !S.me.admin;

    var d = $("details"); d.innerHTML = "";
    if (env.details) linkify(d, env.details);
    else d.appendChild(el("p", { class: "empty", text: S.me.admin ? "No details yet. Use “Edit this page” to describe what this environment demos, how to run it, and who to ask." : "No details yet." }));
    $("notesPanel").hidden = !env.notes; $("notes").textContent = env.notes || "";

    var ul = $("links"); ul.innerHTML = "";
    (env.links || []).forEach(function (l) { ul.appendChild(el("li", {}, [el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label + " ↗", title: l.url })])); });
    if (!(env.links || []).length) ul.appendChild(el("li", { class: "empty", text: "No links yet." }));

    var up = $("upcoming"); up.innerHTML = "";
    mine.filter(function (b) { return b.e > now; }).slice(0, 8).forEach(function (b) {
      up.appendChild(el("li", {}, [
        el("span", { class: "when", text: fmtDay(b.s) + ", " + fmtTime(b.s) + " to " + fmtTime(b.e) }),
        el("span", { class: "sub", text: b.name + (b.purpose ? " · " + b.purpose : "") })
      ]));
    });
    if (!up.children.length) up.appendChild(el("li", { class: "empty", text: "Nothing booked in the next 14 days." }));

    var others = $("others"); others.innerHTML = "";
    var rest = S.cfg.environments.filter(function (e) { return e.id !== env.id; });
    if (rest.length) {
      others.appendChild(document.createTextNode("Other environments:"));
      rest.forEach(function (e) { others.appendChild(el("a", { href: "/env/" + encodeURIComponent(e.id), text: e.name + (e.tagline ? " (" + e.tagline + ")" : "") })); });
    }
  }

  function load() {
    var now = new Date(), from = new Date(now.getTime() - 12 * 3600e3), to = new Date(now.getTime() + 14 * 864e5);
    return Promise.all([api("/api/config"), api("/api/bookings?from=" + iso(from) + "&to=" + iso(to))]).then(function (res) {
      S.cfg = res[0];
      S.env = S.cfg.environments.filter(function (e) { return e.id === envId; })[0];
      if (!S.env) { location.href = "/"; return; }
      S.bookings = res[1].bookings.map(function (b) { b.s = new Date(b.start); b.e = new Date(b.end); return b; });
      render();
    }).catch(function (e) { $("status").textContent = "Couldn't load this page: " + e.message; });
  }

  api("/api/me").then(function (me) {
    S.me = me;
    if (me.auth) { $("who").hidden = false; $("whoText").textContent = "Signed in as " + me.name + (me.admin ? " (admin)" : ""); }
    return load();
  });
  // Refresh once a minute, only while the tab is visible and the page is in use.
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { document.addEventListener(ev, function () { S.lastActive = Date.now(); }, { passive: true }); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { S.lastActive = Date.now(); load(); } });
  setInterval(function () { if (!document.hidden && Date.now() - S.lastActive < 15 * 60000) load(); }, 60000);
})();
</script>
</body>
</html>
